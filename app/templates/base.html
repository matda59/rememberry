<!doctype html>
<html lang="en" data-theme="{{ theme }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#7a2e4a">
  <title>{% block title %}Rememberry{% endblock %}</title>
  <link rel="icon" href="/static/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Rememberry">
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/"><img src="/static/icon.svg" alt="" width="26" height="26"><span>Rememberry</span></a>
    <nav>
      {% if nav != "login" %}
      <a href="/" class="{{ 'active' if nav == 'today' }}">Today</a>
      <a href="/journal" class="{{ 'active' if nav == 'journal' }}">Journal</a>
      <a href="/people" class="{{ 'active' if nav == 'people' }}">People</a>
      <a href="/settings" class="icon {{ 'active' if nav == 'settings' }}" title="Settings" aria-label="Settings">&#9881;&#xFE0E;</a>
      {% endif %}
      {% set next_theme = {"auto": "light", "light": "dark", "dark": "auto"}[theme] %}
      <form method="post" action="/theme" class="theme-toggle" data-theme-toggle>
        <input type="hidden" name="theme" value="{{ next_theme }}">
        <input type="hidden" name="next" value="{{ request.url.path }}">
        <button class="link" title="Theme: {{ theme|capitalize }} (click for {{ next_theme|capitalize }})" aria-label="Theme: {{ theme|capitalize }}. Switch to {{ next_theme|capitalize }}">
          <svg class="ico ico-light" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="ico ico-dark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
          <svg class="ico ico-auto" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/></svg>
        </button>
      </form>
      {% if auth_enabled and nav != "login" %}
      <form method="post" action="/logout" class="inline"><button class="link" title="Log out">Log out</button></form>
      {% endif %}
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
