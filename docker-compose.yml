services:
  rememberry:
    build: .
    image: rememberry:latest
    container_name: rememberry
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./data:/data
    environment:
      TZ: "UTC"  # e.g. Australia/Sydney; decides what "today" is
      # Leave empty to disable the login screen.
      APP_PASSWORD: ""
      # Birthday reminders (all optional; see README for Pushover, Discord and SMTP):
      # REMINDER_DAYS_AHEAD: "3"
      # NTFY_TOPIC: "my-secret-birthday-topic"
